services:
  - type: web
    name: sector-dashboard
    runtime: node
    # الخطة المدفوعة مطلوبة عشان القرص الدائم، وبدونه تنمسح البيانات والصور مع كل نشر أو إعادة تشغيل
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATA_DIR
        value: /var/data
      - key: OWNER_ID
        value: "1241144201199226965"
      - key: SESSION_SECRET
        generateValue: true
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: GUILD_ID
        sync: false
